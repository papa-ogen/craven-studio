<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Craven Studio</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <link rel="manifest" href="/site.webmanifest" />

    <link href="./public/output.css" rel="stylesheet" />
  </head>
  <body class="inter text-beige">
    <main>
      <!-- Start -->
      <div
        id="start"
        class="h-screen bg-gradient-to-r from-[#251d18] to-[#50392b] p-8 sm:px-16 py-4 sm:py-8 flex flex-col"
      >
        <header class="flex items-center">
          <img
            title="C Studio Logo"
            src="./public/c-studio-logo-orange.svg"
            class="w-[128px] hidden md:block mr-auto"
          />
          <nav class="text-beige">
            <ul class="flex space-x-8 sm:space-x-16 items-center">
              <li>
                <a href="#" class="selected">Start</a>
              </li>
              <li>
                <a href="#projects">Projects</a>
              </li>
              <li>
                <a href="#">Music</a>
              </li>
              <li>
                <a href="#">About</a>
              </li>
              <li>
                <a href="#"
                  ><button
                    type="button"
                    title="Make Contact"
                    class="bg-beige text-dark font-light px-4 py-2 rounded-sm"
                  >
                    Contact
                  </button></a
                >
              </li>
            </ul>
          </nav>
        </header>
        <section
          class="my-8 grow bg-dot-pattern flex flex-col items-center sm:items-end pt-16 lg:pt-24"
        >
          <div class="md:mr-24">
            <a href="" class="border px-4 py-2 uppercase"
              >View my <span class="text-orange">portfolio</span></a
            >
            <h1 class="text-6xl lg:text-8xl uppercase bebasNeue mt-6 mb-2">
              Developer
            </h1>
            <h2 class="text-2xl lg:text-4xl font-light mb-20">
              Enhancing the web
            </h2>
            <button
              type="button"
              title="Make Contact"
              class="bg-orange text-xl text-beige font-extralight px-8 py-4 rounded-sm"
            >
              I need a website
            </button>
          </div>
        </section>
      </div>
      <!-- Start -->
      <!-- PROJECTS-->
      <div
      id="projects"
      class="h-screen bg-gradient-to-r from-[#F45C01] to-[#D87236] p-8 sm:px-16 py-4 sm:py-8 flex flex-col"
    >
      <header class="flex items-center">
        <img
          title="C Studio Logo"
          src="./public/c-studio-logo-black.svg"
          class="w-[128px] hidden md:block mr-auto"
        />
        <nav class="text-beige">
          <ul class="flex space-x-8 sm:space-x-16 items-center">
            <li>
              <a href="#" class="selected">Start</a>
            </li>
            <li>
              <a href="#">Projects</a>
            </li>
            <li>
              <a href="#">Music</a>
            </li>
            <li>
              <a href="#">About</a>
            </li>
            <li>
              <a href="#"
                ><button
                  type="button"
                  title="Make Contact"
                  class="bg-beige text-dark font-light px-4 py-2 rounded-sm"
                >
                  Contact
                </button></a
              >
            </li>
          </ul>
        </nav>
      </header>
      <section
        class="my-8 grow bg-dot-pattern-white flex flex-col items-center sm:items-end pt-16 lg:pt-24"
      >
    

      
      </section>
